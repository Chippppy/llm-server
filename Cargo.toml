[package]
name = "llm-server-indicator"
version = "0.1.0"
edition = "2021"
description = "Run and swap multiple local llama.cpp (llama-server) servers with a CLI, systemd template units, an egui GUI, and a Waybar module"
repository = "https://github.com/Chippppy/llm-server"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dirs = "6"
toml = "0.8"
egui = "0.27"
eframe = "0.27"
notify-rust = "4"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
once_cell = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
