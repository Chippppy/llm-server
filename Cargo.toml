[package]
name = "llm-server-indicator"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json"] }
dirs = "5"
toml = "0.8"
egui = "0.27"
egui-winit = "0.27"
winit = "0.29"
tray-icon = "0.21"
notify-rust = "4"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
once_cell = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
