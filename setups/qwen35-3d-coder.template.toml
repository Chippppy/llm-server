# Qwen3.5 4B GLB 3D Coder setup template.
#
# This is a TEMPLATE, not a ready-to-run spec. Copy it to
#   ~/.config/llm-server-indicator/setups/qwen35-3d-coder.toml
# and replace the /path/to/... placeholders with your real paths.
# Files named *.template.toml are ignored by `llm-server-ctl run`.
#
# Model: https://huggingface.co/ccore/Qwen3.5-4B-GLB-3D-Coder
# (Qwen3.5 4B fine-tune for generating Three.js / GLB 3D code; Q8_0 GGUF).
#
# The flag values below are the tuned defaults for Qwen3.5 4B GLB 3D Coder.
# No speculative-decoding draft is published for this model, so the
# draft/spec_type/spec_draft_n_max lines from the other templates are
# omitted entirely.

[server]
# Path to the llama-server binary (required)
binary = "/path/to/llama.cpp/build/bin/llama-server"
# Host to bind (default: "127.0.0.1")
host = "127.0.0.1"
# Port (required; must not already be bound)
port = 8080

[model]
# Main model file (required)
main = "/path/to/models/qwen35-3d-coder/Qwen3.5-4B-GLB-3D-Coder-Q8_0.gguf"

[flags]
# GPU layers for the main model (llama.cpp default: 0)
ngl = 99
# Context size (llama.cpp default: 4096)
ctx_size = 131072
# Flash attention (llama.cpp default: off)
flash_attention = true
# Emit --jinja so the model's chat template handles message rendering (llama.cpp default: off)
jinja = true
# KV cache type for K (llama.cpp default: f16)
cache_type_k = "q8_0"
# KV cache type for V (llama.cpp default: f16)
cache_type_v = "q8_0"
# Sampling temperature (llama.cpp default: 0.8) — not tuned for this model
#temp = 1.0
# Nucleus sampling (llama.cpp default: 0.95) — not tuned for this model
#top_p = 0.95
# Top-k sampling (llama.cpp default: 40) — not tuned for this model
#top_k = 64
# Extra arguments appended verbatim to the llama-server command line
extra_args = ["-np", "1", "--no-reasoning-preserve", "--chat-template-kwargs", "{\"reasoning_effort\":\"medium\"}"]
